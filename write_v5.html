<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14163a">
<title>Art Studio</title>
<style>
/* ==================================================================
   Art Studio -- offline single-file drawing app for young children

   #paper provides the background. #art retains paint in world coordinates;
   #scratch accumulates individual pigment deposits. #live previews the same
   composition that will be committed. #outlines redraws immutable vector
   guides at native screen resolution. All workspace scaling is uniform.
=================================================================== */

*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;}

html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:#14163a;font-family:ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI Variable",Verdana,sans-serif;}

:root{
  --app-h:100dvh; --app-top:0px;
  --toolW:90px; --toolH:80px; --swD:58px; --actD:62px;
  --toolIco:23px; --toolCap:11px; --stIco:27px;
}
canvas.layer{position:fixed;left:0;top:var(--app-top);display:block;width:100%;height:var(--app-h);}
#art,#scratch{pointer-events:none;}
#scratch{pointer-events:none;}
#hit{position:fixed;left:0;top:var(--app-top);width:100%;height:var(--app-h);cursor:crosshair;}

/* ---------------- shell ---------------- */
#ui{position:fixed;left:0;top:var(--app-top);width:100%;height:var(--app-h);pointer-events:none;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;
  padding:calc(6px + env(safe-area-inset-top)) 8px 8px 8px;}

.panel{pointer-events:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-radius:24px;box-shadow:0 8px 26px rgba(10,15,45,.24);padding:10px;
  display:flex;gap:7px;align-items:center;}

#topRow{grid-column:1/4;grid-row:1;display:flex;justify-content:space-between;
  align-items:flex-start;gap:8px;pointer-events:none;flex-wrap:wrap;}
#actions{flex-wrap:wrap;justify-content:flex-end;}
#rail{grid-column:1;grid-row:2;align-self:center;flex-direction:column;flex-wrap:wrap;
  min-height:0;max-height:100%;align-content:flex-start;}
#side{grid-column:3;grid-row:2;align-self:center;flex-direction:column;min-height:0;flex-wrap:wrap;
  max-height:100%;align-content:flex-end;}
#bottom{grid-column:1/4;grid-row:3;justify-self:center;max-width:100%;flex-wrap:wrap;
  justify-content:center;margin-bottom:env(safe-area-inset-bottom);}

/* ---------------- buttons ---------------- */
.b{pointer-events:auto;border:0;background:#eef1f7;border-radius:18px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  transition:transform .09s ease,background .15s,box-shadow .15s;font:inherit;color:#232746;
  line-height:1;padding:0;}
.b.press{transform:scale(.9);}
.b .ico{font-size:clamp(19px,3vmin,26px);}
.b .cap{font-size:10px;font-weight:800;letter-spacing:.2px;opacity:.62;}
.act{width:var(--actD);height:var(--actD);}

/* tool button: icon, live stroke sample, name */
.tool{width:var(--toolW);height:var(--toolH);position:relative;
  overflow:hidden;background:#f2f4fa;border:3px solid transparent;}
.tool .ico{font-size:var(--toolIco);}
.tool canvas{width:84%;aspect-ratio:180/40;max-height:20px;pointer-events:none;}
.tool .cap{font-size:var(--toolCap);opacity:.7;}
.tool.on{background:#fff;border-color:var(--ink);transform:scale(1.05);
  box-shadow:0 0 0 5px rgba(47,107,255,.18),0 8px 18px rgba(10,15,45,.2);}
.tool.on .cap{opacity:1;}
.tool.on::after{content:"";position:absolute;top:5px;right:6px;width:10px;height:10px;
  border-radius:50%;background:var(--ink);}

/* colour swatch */
.sw{width:var(--swD);height:var(--swD);border-radius:50%;
  border:4px solid #fff;box-shadow:0 3px 8px rgba(10,15,45,.25);cursor:pointer;
  pointer-events:auto;transition:transform .12s;padding:0;}
.sw.on{transform:scale(1.2);border-color:#232746;
  box-shadow:0 0 0 4px rgba(35,39,70,.15),0 4px 10px rgba(10,15,45,.3);}

/* stamp picker shares the bottom bar */
.st{width:var(--swD);height:var(--swD);border-radius:16px;
  background:#f2f4fa;font-size:var(--stIco);display:grid;place-items:center;
  border:0;cursor:pointer;pointer-events:auto;padding:0;}
.st.on{background:#fff;box-shadow:0 0 0 4px var(--ink);transform:scale(1.1);}

.size{width:var(--actD);height:var(--actD);border-radius:50%;background:#eef1f7;}
.size i{display:block;border-radius:50%;background:#3a3f63;}
.size.on{background:#fff;box-shadow:0 0 0 4px rgba(47,107,255,.26);}
.size.on i{background:var(--ink);}

/* the big cycle paddle: one target, tap it again and again */
#btnNext{width:calc(var(--actD) * 1.15);height:calc(var(--actD) * 1.15);border-radius:50%;
  background:linear-gradient(160deg,#fff,#dde6ff);box-shadow:0 0 0 3px #fff,0 6px 16px rgba(10,15,45,.28);}
#btnNext .ico{font-size:clamp(22px,3.4vmin,30px);}

/* ---------------- status ---------------- */
#status{pointer-events:none;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);
  border-radius:999px;padding:6px 16px 6px 8px;box-shadow:0 6px 18px rgba(10,15,45,.2);
  font-weight:800;font-size:clamp(13px,2vmin,17px);color:#232746;}
#status .dot{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d7dbe8;}
#status .big{font-size:22px;}

#grown{pointer-events:auto;width:46px;height:46px;border-radius:14px;background:rgba(35,39,70,.85);
  display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;flex:none;}
#grown .badge{font-size:20px;position:relative;filter:grayscale(1) brightness(3);}
#grown .fill{position:absolute;left:0;bottom:0;width:100%;height:0%;background:#4ade80;opacity:.85;}
#grown.locked{background:#16a34a;}

/* ---------------- sheets ---------------- */
.sheet{position:fixed;inset:0;background:rgba(20,22,58,.74);backdrop-filter:blur(6px);z-index:50;
  display:none;place-items:center;pointer-events:auto;padding:18px;}
.sheet.open{display:grid;}
.card{background:#fff;border-radius:28px;padding:20px;max-width:min(820px,95vw);max-height:88vh;
  overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.42);
  touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.card h2{margin:0 0 6px;font-size:20px;color:#232746;}
.card h3{margin:16px 0 8px;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:#8b91b0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
.card .b{height:92px;border-radius:20px;gap:6px;background:#f2f4fa;width:100%;}
.card .b .ico{font-size:28px;}
.card .b .cap{font-size:12px;opacity:.82;}
.card .b.on{box-shadow:0 0 0 4px var(--ink) inset;background:#fff;}
.hint{margin:14px 2px 0;font-size:13px;color:#5b6080;line-height:1.55;}
.step{display:flex;gap:14px;align-items:flex-start;margin:14px 0;}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;}
.step .n.warn{background:#b4530f;}
.step h4{margin:2px 0 4px;font-size:16px;color:#232746;}
.step p{margin:0;font-size:14px;line-height:1.55;color:#4a5070;}
.bigbtn{display:block;width:100%;margin-top:18px;border:0;border-radius:18px;background:var(--ink);
  color:#fff;font:800 17px/1 inherit;padding:16px;cursor:pointer;
  position:sticky;bottom:-20px;box-shadow:0 -14px 20px 14px #fff;}

#fsChip{position:fixed;left:calc(64px + env(safe-area-inset-left));top:calc(9px + env(safe-area-inset-top));
  display:none;z-index:70;border:0;cursor:pointer;pointer-events:auto;background:#b4530f;color:#fff;
  font:800 14px/1.2 inherit;padding:12px 18px;border-radius:16px;max-width:min(420px,70vw);text-align:left;
  box-shadow:0 6px 18px rgba(10,15,45,.35);}
#fsChip.show{display:block;}
#fsChip::before{content:"⛶  ";}

#lockRing{position:fixed;inset:0;border:5px solid #16a34a;pointer-events:none;display:none;z-index:60;}
#lockRing.show{display:block;}
#lockPill{position:fixed;left:calc(64px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));
  display:none;z-index:71;background:#16a34a;color:#fff;font:800 13px/1 inherit;padding:10px 14px;
  border-radius:999px;pointer-events:none;box-shadow:0 4px 12px rgba(10,15,45,.3);}
#lockPill.show{display:block;}
#fsChip.show ~ #lockPill{display:none;}
.code{user-select:text;-webkit-user-select:text;display:block;background:#232746;color:#a8e6a3;
  font:600 13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;border-radius:10px;
  margin:8px 0 0;word-break:break-all;}

#toast{position:fixed;left:50%;bottom:14%;transform:translate(-50%,20px);background:rgba(35,39,70,.94);
  color:#fff;padding:12px 22px;border-radius:999px;font-weight:800;font-size:16px;opacity:0;
  transition:.25s;pointer-events:none;z-index:80;}
#toast.show{opacity:1;transform:translate(-50%,0);}

@media (max-width:820px){
  #ui{grid-template-rows:auto minmax(0,1fr) auto auto;}
  #rail{grid-column:1/4;grid-row:3;flex-direction:row;flex-wrap:wrap;max-height:none;
        justify-self:center;justify-content:center;}
  #bottom{grid-row:4;}
}
@media (max-width:560px){
  #status{padding:5px 10px 5px 6px;}
  #status #stName{display:none;}
  #actions .cap{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* A stable, separate sheet keeps every outline within little hands' reach. */
html,body{background:#edf0fa;color:#293052}
#ui{gap:12px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#stage{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;pointer-events:auto}
#page{position:absolute;overflow:hidden;border-radius:18px;background:white;box-shadow:0 5px 28px #30385818}
canvas.layer,#hit{position:absolute;inset:0;top:0;width:100%;height:100%}
#outlines,#live{pointer-events:none}
#scratch{visibility:hidden}
#live{display:none}
#page{isolation:isolate}
.panel{box-shadow:0 3px 14px #3038580d;backdrop-filter:none;border:1px solid #e1e5f0;border-radius:22px}
#rail{flex-wrap:nowrap;overflow-y:auto;touch-action:pan-y;max-height:100%}
#rail .tool{flex-shrink:0}
#rail .tool.extra{display:none}
body.allTools #rail .tool.extra{display:flex}
#bottom{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;touch-action:pan-x;width:max-content;max-width:100%;padding:12px 16px}
#bottom>*{flex-shrink:0}
#actions{flex-wrap:nowrap}
#topRow{flex-wrap:nowrap;align-items:center}
#status{box-shadow:none;background:transparent}
#btnNext{width:var(--actD);height:var(--actD);flex-shrink:0}
#side{flex-wrap:nowrap;overflow-y:auto;touch-action:pan-y}
#side>*{flex-shrink:0}
#lockRing{border-width:2px;opacity:.4}
#lockPill{display:none!important}
#fsChip{font-size:12px;left:70px;top:74px;max-width:220px}
.sheet .card{width:820px;touch-action:pan-y}
.sheet .card *{touch-action:pan-y}
.sheetHeading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.closeSheet{border:0;border-radius:50%;width:44px;height:44px;font-size:22px;background:#edf0fa;cursor:pointer}
#surprise{position:static;box-shadow:none;margin:12px 0 18px;background:#6554c0;font-size:15px}
.wordRow{display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap}.wordRow input{min-width:140px;flex:1;padding:12px;border:2px solid #dce1ef;border-radius:12px;font:inherit;user-select:text;-webkit-user-select:text;touch-action:auto}.wordRow button{border:0;background:#6554c0;color:white;padding:12px;border-radius:12px;font:inherit;cursor:pointer}
.preview{width:100%;height:82px;object-fit:contain;pointer-events:none}
.grid .b{height:118px;padding:8px;background:#f5f6fb}
.b:focus-visible,.sw:focus-visible,#grown:focus-visible{outline:4px solid #6554c0;outline-offset:3px}
button:disabled{opacity:.3!important;cursor:default}
#toast{max-width:90vw;text-align:center;font-size:14px}
@media(max-width:820px){
 #ui{gap:8px;padding:8px;grid-template-rows:auto minmax(0,1fr) auto auto}
 #stage{grid-column:1/3;grid-row:2}
 #rail{grid-column:1/4;grid-row:3;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-width:100%;justify-content:flex-start;touch-action:pan-x}
 #bottom{grid-row:4}
 #side{grid-column:3;grid-row:2;padding:8px}
 #status{font-size:13px;padding:0}
 #status .big{font-size:22px}
 #actions{padding:6px;gap:4px}
 #grown{width:44px;height:44px}
}
@media(max-height:480px){#status{display:none}#ui{gap:5px}#rail .tool canvas{display:none}#rail .tool{height:44px}#bottom{padding:6px 12px}}


/* The whole viewport is paper; controls float over its edges. No child UI scrolls. */
[hidden]{display:none!important}
#stage{position:fixed;inset:0;top:var(--app-top);height:var(--app-h);width:100%;z-index:0}
#page{border-radius:0;box-shadow:none}
#topRow,#rail,#side,#bottom{position:relative;z-index:2}
#rail,#bottom,#side{overflow:hidden;touch-action:none}
#side{display:grid;grid-template-columns:1fr}
#rail .tool.extra{display:flex}
#bottom{max-width:100%;width:max-content;justify-content:center}
.moreButton{min-width:44px;min-height:44px;background:#e8e3fa;color:#47318b;font-weight:800;border:0;border-radius:16px;cursor:pointer;flex-shrink:0}
#paperCard{display:flex;flex-direction:column;gap:8px;height:calc(var(--app-h) - 36px);max-height:none;max-width:min(900px,calc(100vw - 36px));padding:14px;overflow:hidden}
#paperCard .sheetHeading{flex-shrink:0}
#paperCard h2{font-size:19px}
#paperTabs,#paperPager{display:flex;gap:6px;align-items:center;flex-shrink:0}
#paperTabs button,#paperPager button{font-family:inherit;font-size:14px;font-weight:700;min-height:44px;border:0;border-radius:12px;background:#edf0fa;color:#293052;padding:8px;cursor:pointer;flex:1}
#paperTabs button.on{background:#6554c0;color:white}
#paperPager span{min-width:62px;text-align:center;font-weight:700}
#paperCard #surprise{margin:0;padding:10px;min-height:44px;flex-shrink:0}
#paperCard .grid{flex:1;min-height:0;gap:10px;grid-template-columns:repeat(var(--paper-cols,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
#paperCard .grid .b{height:100%;min-height:0;padding:8px;overflow:hidden}
#paperCard .preview{min-height:0;height:calc(100% - 24px);max-height:180px}
#wordForm{flex:1;padding:12px 0}
@media(max-height:600px){#side{grid-template-columns:repeat(2,var(--actD));padding:6px;gap:5px}#paperCard{gap:5px;padding:8px}#paperCard .preview{max-height:90px}#paperCard h2{font-size:16px}}
#paperTabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
#paperTabs button{min-width:0;padding:6px 2px;font-size:13px;overflow-wrap:normal}
@media(max-width:560px){#paperTabs button{font-size:11px}}
/* Toddler-sized controls: stable tiles rather than tiny circular targets. */
#actions{gap:8px}
#actions .cap{display:block;font-size:13px;opacity:1}
#actions .ico{font-size:32px}
#btnPaper{background:#e5ddff}#btnNew{background:#d7f4ec}
#bottom{display:grid;gap:7px;padding:10px 12px}
.sw{border-radius:16px;position:relative;border-width:3px;box-shadow:0 2px 5px #23274633}
.sw.on{transform:none;border-color:#232746;box-shadow:inset 0 0 0 2px white}
.colorCheck{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:white;color:#232746;font-size:23px;font-weight:bold;margin:auto}
button{touch-action:manipulation}
button:active{filter:brightness(.9)}
.closeSheet{min-width:56px;min-height:56px}
#paperTabs button,#paperPager button{min-height:56px}
@media(max-width:560px){
 #status{display:none}#topRow{gap:4px}#actions{padding:6px;gap:4px}
 #actions .cap{font-size:10px}#actions .ico{font-size:26px}
 #grown{width:48px;height:56px}#side{padding:6px;gap:7px}
}
@media(max-height:480px){
 #rail .tool{height:var(--toolH)}#side{grid-template-columns:repeat(3,var(--actD))}
 #side{align-self:start}#bottom{padding:6px 12px}#actions .ico{font-size:26px}
}
</style>
</head>
<body class="allTools" style="--ink:#2f6bff">



<div id="ui">
  <div id="stage"><div id="page"><canvas id="paper" class="layer"></canvas><canvas id="art" class="layer"></canvas><canvas id="scratch" class="layer"></canvas><canvas id="live" class="layer"></canvas><canvas id="outlines" class="layer"></canvas><div id="hit" aria-label="Drawing paper"></div></div></div>
  <div id="topRow">
    <div id="grown" role="button" tabindex="0" aria-label="Hold for three seconds for grown-up controls"><div class="fill"></div><span class="badge">🔒</span></div>

      <button class="b act" id="btnUndo"><span class="ico">↩️</span><span class="cap">Undo</span></button>

  <div class="grid" id="plainGrid"></div><div class="grid" id="pictureGrid"></div><div class="grid" id="traceGrid"></div><div class="grid" id="patternGrid"></div>

</div></div>

</div></div>

<script>
"use strict";
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

/* ==================================================================
   1. Canvas stack
=================================================================== */
const paper   = document.getElementById('paper');
const art     = document.getElementById('art');
const scratch = document.getElementById('scratch');

/* ------------------------------------------------------------------
   Viewport and fit

   window.innerHeight is the LAYOUT viewport. On a phone or tablet the
   browser toolbars sit on top of it, so anything anchored to the bottom
   ends up underneath them. visualViewport is the part actually on
   screen, and that is what the app is sized to.

   fitUI then shrinks the controls, in steps, until the top bar, the
   tool rail and the palette all fit in that height with room left for
   the paper. It sizes for the 32-item stamp row, not the 14-item colour
   row, so the layout never jumps when the stamp tool is chosen.
------------------------------------------------------------------- */
const vp = window.visualViewport || null;
function viewH(){ return Math.round(vp ? vp.height : window.innerHeight); }
function viewW(){ return Math.round(vp ? vp.width  : window.innerWidth); }

const SIZE_STEPS = [
  {toolW:90, toolH:80, sw:58, act:62, ico:23, cap:11, st:27},

  {toolW:67, toolH:59, sw:44, act:47, ico:18, cap:9,  st:21},
  {toolW:60, toolH:53, sw:40, act:43, ico:17, cap:9,  st:19},
  {toolW:54, toolH:47, sw:36, act:39, ico:15, cap:8,  st:17},
  {toolW:48, toolH:42, sw:33, act:35, ico:14, cap:8,  st:16}
];
const GAP = 7, PANEL_PAD = 20, UI_PAD = 16;

function rowsNeeded(n, itemW, avail){
  const per = Math.max(1, Math.floor((avail + GAP) / (itemW + GAP)));
  return {rows: Math.ceil(n / per), per};
}
function applyStep(st){
  const r = document.documentElement.style;
  r.setProperty('--toolW', st.toolW+'px');
  r.setProperty('--toolH', st.toolH+'px');
  r.setProperty('--swD',   st.sw+'px');
  r.setProperty('--actD',  st.act+'px');
  r.setProperty('--toolIco', st.ico+'px');
  r.setProperty('--toolCap', st.cap+'px');
  r.setProperty('--stIco', st.st+'px');
}

function fitUI(){
  const H=viewH(), W=viewW(), r=document.documentElement.style;
  r.setProperty('--app-h',H+'px');
  r.setProperty('--app-top',Math.round(vp ? vp.offsetTop : 0)+'px');
  applyStep(W < 560 || H < 500 ? {toolW:64,toolH:64,sw:56,act:56,ico:28,cap:11,st:32} :
    {toolW:96,toolH:88,sw:76,act:80,ico:34,cap:13,st:38});
}

function copyOf(src){
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}

function backingDensity(width,height){
  const zoom=Math.min(viewW()/designWidth,viewH()/designHeight);
  return Math.min(3,Math.max(2,(window.devicePixelRatio||1)*zoom),Math.sqrt(8000000/(width*height)));
}
function setDocumentSize(width,height,ratio=backingDensity(width,height)){
  vw=width;vh=height;dpr=ratio;
  for(const c of [paper,art,scratch,document.getElementById('live'),guideCanvas]){
    c.width=Math.ceil(vw*dpr);c.height=Math.ceil(vh*dpr);
  }
  for(const c of [pctx,actx,sctx]){c.setTransform(dpr,0,0,dpr,0,0);c.lineCap='round';c.lineJoin='round';}
}
function placeArtwork(image,width,height){
  // Center old workspace pixels without changing their world-space proportions.
  actx.drawImage(image,(vw-width)/2,(vh-height)/2,width,height);
}
function sizeLayers(){
  finish();fitUI();
  if(!vw){designWidth=1000;designHeight=Math.round(1000*viewH()/viewW());setDocumentSize(designWidth,designHeight);}
  viewScale=Math.min(viewW()/designWidth,viewH()/designHeight);
  // Expand the retained workspace when an orientation exposes new margins.
  // Never crop it or shrink it: drawings in those margins survive future rotations.
  const width=Math.max(vw,Math.ceil(viewW()/viewScale));
  const height=Math.max(vh,Math.ceil(viewH()/viewScale));
  const ratio=backingDensity(width,height);
  if(width!==vw||height!==vh||Math.abs(ratio-dpr)>.01){
    if(!resizeSource||resizeSource.revision!==artRevision)resizeSource={image:copyOf(art),width:vw,height:vh,revision:artRevision};
    setDocumentSize(width,height,ratio);placeArtwork(resizeSource.image,resizeSource.width,resizeSource.height);
  }
  viewLeft=(viewW()-vw*viewScale)/2;viewTop=(viewH()-vh*viewScale)/2;
  Object.assign(document.getElementById('page').style,{width:viewW()+'px',height:viewH()+'px',left:'0px',top:'0px'});
  for(const c of [paper,art,scratch,document.getElementById('live')]){
    Object.assign(c.style,{width:vw*viewScale+'px',height:vh*viewScale+'px',left:viewLeft+'px',top:viewTop+'px',right:'auto',bottom:'auto'});
  }
  drawPaper();updateToolPage();buildBottom();
  if(document.getElementById('paperSheet').classList.contains('open'))buildPaperSheet();
}

function paperBase(){
  return paperId === 'night' ? '#191b33'
       : paperId === 'cream' ? '#fdf6e3'
       : paperId === 'sky'   ? '#eaf4ff'
       : '#ffffff';
}

function drawPaper(){
  pctx.save();
  pctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.fillStyle = paperBase();
  pctx.fillRect(0,0,vw,vh);
  const rule = paperId === 'night' ? 'rgba(255,255,255,.15)' : 'rgba(60,70,110,.17)';

  if (paperId === 'grid'){
    pctx.strokeStyle = rule; pctx.lineWidth = 1; pctx.beginPath();
    for (let x = ((vw-designWidth)/2)%46; x < vw; x += 46){ pctx.moveTo(x+.5,0); pctx.lineTo(x+.5,vh); }
    for (let y = ((vh-designHeight)/2)%46; y < vh; y += 46){ pctx.moveTo(0,y+.5); pctx.lineTo(vw,y+.5); }
    pctx.stroke();
  }
  if (paperId === 'dots'){
    pctx.fillStyle = rule;
    for (let x = ((vw-designWidth)/2)%40; x < vw; x += 40)
      for (let y = ((vh-designHeight)/2)%40; y < vh; y += 40){ pctx.beginPath(); pctx.arc(x,y,2,0,TAU); pctx.fill(); }
  }
  if (paperId === 'lined'){
    pctx.strokeStyle = rule; pctx.lineWidth = 2; pctx.beginPath();
    for (let y = (72+(vh-designHeight)/2)%62; y < vh; y += 62){ pctx.moveTo(26,y); pctx.lineTo(vw-26,y); }
    pctx.stroke();
  }
  pctx.restore();
  // Preserve printed outlines above all paint, including black bucket fills.
  const oc=guideCanvas.getContext('2d');
  oc.clearRect(0,0,paper.width,paper.height);
  if (PICTURE_ART[paperId]){
    oc.save(); const s=Math.min(designWidth,designHeight)*.82;
    oc.setTransform(dpr,0,0,dpr,0,0);oc.translate((vw-s)/2,(vh-s)/2);oc.scale(s/100,s/100);
    oc.lineWidth=220/(s*viewScale);oc.traceWidth=150/(s*viewScale);oc.lineJoin='round';oc.lineCap='round';oc.strokeStyle='#2b3157';
    PICTURE_ART[paperId](oc);oc.restore();
  }
  // Display vectors at native device resolution, independently of the retained
  // paint workspace's memory budget. They never get stretched or resampled.
  const visible=document.getElementById('outlines'),pixelRatio=Math.min(3,window.devicePixelRatio||1);
  visible.width=Math.ceil(viewW()*pixelRatio);visible.height=Math.ceil(viewH()*pixelRatio);
  Object.assign(visible.style,{left:'0px',top:'0px',width:viewW()+'px',height:viewH()+'px',right:'auto',bottom:'auto'});
  if(PICTURE_ART[paperId]){
    const vc=visible.getContext('2d'),s=Math.min(designWidth,designHeight)*.82;
    vc.setTransform(pixelRatio*viewScale,0,0,pixelRatio*viewScale,viewLeft*pixelRatio,viewTop*pixelRatio);
    vc.translate((vw-s)/2,(vh-s)/2);vc.scale(s/100,s/100);
    vc.lineWidth=220/(s*viewScale);vc.traceWidth=150/(s*viewScale);
    vc.lineJoin='round';vc.lineCap='round';vc.strokeStyle='#2b3157';PICTURE_ART[paperId](vc);
  }
  guidePixels=null;
  if(PICTURE_ART[paperId]){
    const pixels=oc.getImageData(0,0,paper.width,paper.height);
    guidePixels=new Uint8Array(paper.width*paper.height);
    for(let i=0;i<guidePixels.length;i++){
      guidePixels[i]=pixels.data[i*4+3];
    }
  }
}
// Printed vectors stay on top. Do not punch binary holes in artwork: that
// removes antialiased edge coverage and produces white pixel halos.

/* --- little helpers so the pictures read cleanly --- */
function ring(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke(); }
function oval(c,x,y,rx,ry,rot){ c.beginPath(); c.ellipse(x,y,rx,ry,rot||0,0,TAU); c.stroke(); }
function line(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function poly(c,pts,close){
  c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
  if (close) c.closePath();
  c.stroke();
}
function curve(c,x1,y1,cx,cy,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.quadraticCurveTo(cx,cy,x2,y2); c.stroke(); }
function ground(c,y){ line(c,3,y,97,y); }

    c.beginPath();c.ellipse(x,y,size*.49,size*.36,-.4,0,TAU);c.fill();c.restore();
  },
  pencil(c,x,y,size,col){
    c.save();c.fillStyle=grain(col);c.globalCompositeOperation='multiply';c.globalAlpha=.18+stroke.dyn*.1;
    c.beginPath();c.ellipse(x,y,size*.32,size*.26,-.4,0,TAU);c.fill();c.restore();
  },
  marker(c,x,y,size,col){

  paint(c,x,y,size,col){

  },
  spray(c,x,y,size,col){

  neon(c,x,y,size,col){

/* ---- stroked brushes ---- */
function strokeSeg(c,p1,p2,width,style){
  c.strokeStyle = style; c.lineWidth = width; c.globalAlpha = 1;
  c.beginPath();
  c.moveTo(p1.x,p1.y);
  if (p1.x === p2.x && p1.y === p2.y) c.lineTo(p2.x+.01,p2.y); else c.lineTo(p2.x,p2.y);

/* ==================================================================
   4. Stroke state
=================================================================== */
const stroke = {
  active:false, pts:[], carry:0, hue:0, angle:0, size:12, dabbedOnce:false,
  dyn:.55, tPrev:0, n:0, pen:false, lastFlat:0, flatAt:{x:0,y:0}
};

/* ---- sensitivity ----------------------------------------------------
   A stylus reports real pressure. A finger and a mouse report a flat
   0.5, so pressure alone gives a dead, uniform line. Speed is the
   signal that is always there: a slow, deliberate stroke lays down a
   fat dark line, a quick flick tapers to a thin one, which is how a
   real crayon behaves. Pen pressure and speed are mixed when both are
   available. The first few points ramp up so strokes start with a
   point rather than a blob. ---------------------------------------- */
function feedDynamics(p, prevP, tNow){
  const dt   = Math.max(1, tNow - stroke.tPrev);
  const dist = Math.hypot(p.x - prevP.x, p.y - prevP.y);
  const speed = dist / dt;                       // pixels per millisecond
  const target = 1 / (1 + speed * 0.32);
  stroke.dyn = stroke.dyn * 0.72 + target * 0.28;
  stroke.tPrev = tNow;
  stroke.n++;
}
function effectivePressure(p){
  const fromSpeed = clamp(0.36 + stroke.dyn * 0.6, 0.2, 1);
  const base = stroke.pen ? (p.pressure * 0.6 + fromSpeed * 0.4) : fromSpeed;
  const ramp = Math.min(1, 0.75 + stroke.n * 0.08);   // taper into the stroke
  return clamp(base * ramp, 0.08, 1);
}

function segment(c, key, col, p1, p2, size, sym){
  const b = BRUSHES[key];
  const run = () => {
    if (b.kind === 'line'){
      if (key === 'rainbow'){
        const d=Math.hypot(p2.x-p1.x,p2.y-p1.y),steps=Math.max(1,Math.ceil(d/2));
        for(let i=0;i<steps;i++){
          const a=i/steps,b=(i+1)/steps;
          stroke.hue=(stroke.hue+d/steps*.65)%360;
          strokeSeg(c,{x:p1.x+(p2.x-p1.x)*a,y:p1.y+(p2.y-p1.y)*a},
            {x:p1.x+(p2.x-p1.x)*b,y:p1.y+(p2.y-p1.y)*b},size,`hsl(${stroke.hue},82%,62%)`);
        }
      } else {
        strokeSeg(c, p1, p2, size, col);
      }
      return;
    }
    const dx = p2.x-p1.x, dy = p2.y-p1.y, d = Math.hypot(dx,dy);
    if(d>0){
      const target=Math.atan2(dy,dx),delta=Math.atan2(Math.sin(target-stroke.angle),Math.cos(target-stroke.angle));
      stroke.angle+=delta*.25;
    }
    const gap = Math.max(.6, b.gap(size));
    const dabs = [];
    let t = stroke.carry;
    if (d === 0){
      if (!stroke.dabbedOnce){ dabs.push([p1.x,p1.y]); stroke.dabbedOnce = true; stroke.carry = gap; }
    } else {
      while (t <= d){ const f = t/d; dabs.push([p1.x+dx*f, p1.y+dy*f]); t += gap; }
      stroke.carry = t - d;
      stroke.dabbedOnce = true;
    }
    for (const p of dabs) DAB[key](c, p[0], p[1], size, col);
  };

}

function mirrored(c, run){
  const cx = vw/2, cy = vh/2;
  const ops = symmetry === 2 ? [[1,1,0],[-1,1,0]]
            : symmetry === 4 ? [[1,1,0],[-1,1,0],[1,-1,0],[-1,-1,0]]
            : [];
  if (symmetry === 8){
    for (let i=0;i<4;i++){ ops.push([1,1,i*Math.PI/2]); ops.push([-1,1,i*Math.PI/2]); }
  }
  const initial={carry:stroke.carry,dabbedOnce:stroke.dabbedOnce,hue:stroke.hue,angle:stroke.angle};
  const initialSeed=seed;
  for (const o of ops){
    Object.assign(stroke,initial);seed=initialSeed;
    c.save();
    c.translate(cx,cy); c.rotate(o[2]); c.scale(o[0],o[1]); c.translate(-cx,-cy);
    run();
    c.restore();
  }
}

/* neon redraws its whole path each frame so the glow stays even */
function repaintPath(c){
  c.save(); c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,c.canvas.width,c.canvas.height);
  c.restore();
  const pts = stroke.pts;
  if (pts.length < 1) return;
  const w = stroke.size;
  const run = () => {
    c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; c.globalAlpha = 1;
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 1) c.lineTo(pts[0].x+.01, pts[0].y);
    for (let i=1;i<pts.length-1;i++){
      const m = {x:(pts[i].x+pts[i+1].x)/2, y:(pts[i].y+pts[i+1].y)/2};
      c.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y);
    }
    if (pts.length > 1) c.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    c.shadowColor = color; c.shadowBlur = w*1.7;
    c.strokeStyle = color; c.stroke();
    c.stroke();
    c.shadowBlur = w*.5;
    c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(1.6, w*.3);
    c.stroke();
    c.shadowBlur = 0;
  };
  if (symmetry > 1) mirrored(c, run); else run();
}

/* Pigment tools multiply against existing ink. White and dark paper use
   ordinary coverage so light-colored media remain visible. */
function paperIsDark(){ return paperId === 'night'; }
function blendFor(key){
  if (!BRUSHES[key].mix || color==='#ffffff' || paperIsDark()) return 'source-over';
  return 'multiply';
}

/* Wet media continue to deposit material when held still. */
let wetTimer = null;

function wetTick(){
  if (!stroke.active) return;
  const b = BRUSHES[tool];
  if (!b || !b.drip || b.kind !== 'dab' || !prev) return;

  feedDynamics(prev, prev, performance.now());     // standing still means slow
  stroke.dabbedOnce = false;
  const size = brushSize(tool, effectivePressure(prev));
  segment(sctx, tool, color, prev, prev, size, true);
  settleIfLingering();
}

function settleIfLingering(){
  // Keep a single wet stroke intact: periodic flattening creates dark seams.
}

// Compose preview and final pigment with the same Canvas blend operation.
// CSS blending against the page used to change the color on pointer release.
const live=document.getElementById('live'),lctx=live.getContext('2d');
let liveFrame=0;
function previewStroke(){
  if(!stroke.active||BRUSHES[tool].kind==='wipe')return;
  lctx.clearRect(0,0,live.width,live.height);
  lctx.drawImage(art,0,0);
  lctx.save();lctx.globalCompositeOperation=blendFor(tool);lctx.globalAlpha=BRUSHES[tool].flow;
  lctx.drawImage(scratch,0,0);lctx.restore();
  live.style.display='block';art.style.visibility='hidden';
  liveFrame=requestAnimationFrame(previewStroke);
}

function clearScratch(){
  sctx.save(); sctx.setTransform(1,0,0,1,0,0);
  sctx.clearRect(0,0,scratch.width,scratch.height);
  sctx.restore();
}
function flattenScratch(flow, blend){
  actx.save();
  actx.setTransform(1,0,0,1,0,0);
  actx.globalCompositeOperation = blend || 'source-over';
  actx.globalAlpha = flow;
  actx.drawImage(scratch, 0, 0);
  actx.restore();
  clearScratch();
}

/* ==================================================================
   5. Pointer input
=================================================================== */
const hit = document.getElementById('hit');
let activeId = null, prev = null;

function at(e){
  const r = hit.getBoundingClientRect();
  let p = e.pressure;
  if (!p || e.pointerType === 'mouse') p = .5;
  return {x:(e.clientX-r.left-viewLeft)/viewScale,y:(e.clientY-r.top-viewTop)/viewScale,pressure:p};
}

hit.addEventListener('pointerdown', e => {
  if (activeId !== null || sheetOpen() || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  activeId = e.pointerId;
  hit.setPointerCapture(e.pointerId);
  const p = at(e);
  const b = BRUSHES[tool];

  if (b.kind === 'tap'){ bucketFill(p.x,p.y,color); chime(300,'sine'); return; }

  history_.push();
  stroke.active = true; stroke.pts = [p]; stroke.carry = 0; stroke.dabbedOnce = false;
  stroke.dyn = .55; stroke.angle=0;stroke.hue=0; stroke.n = 0; stroke.tPrev = e.timeStamp || performance.now();
  stroke.pen = (e.pointerType === 'pen');
  stroke.size = brushSize(tool, effectivePressure(p));
  seed = (Date.now() & 0xffff) | 1;
  prev = p;
  wetColor=null;
  if(tool==='paint'){
    const px=clamp(Math.round(p.x*dpr),0,art.width-1),py=clamp(Math.round(p.y*dpr),0,art.height-1);
    const under=actx.getImageData(px,py,1,1).data;
    if(under[3]>80){const rgb=rgbOf(color),amount=.28*under[3]/255;
      wetColor='#'+rgb.map((v,i)=>Math.round(v*(1-amount)+under[i]*amount).toString(16).padStart(2,'0')).join('');}
  }

  if (b.kind === 'wipe'){ wipe(p,p); return; }
  scratch.style.opacity = b.flow;
  scratch.style.mixBlendMode = blendFor(tool) === 'source-over' ? 'normal' : blendFor(tool);
  if (b.kind === 'path') repaintPath(sctx);
  else segment(sctx, tool, color, p, p, stroke.size, true);
  if (tool === 'stamp') chime(760,'triangle');
  stroke.lastFlat = performance.now();
  stroke.flatAt = {x:p.x, y:p.y};
  clearInterval(wetTimer);
  if (b.drip) wetTimer = setInterval(wetTick, 70);
  previewStroke();
});

hit.addEventListener('pointermove', e => {
  if (e.pointerId !== activeId || !stroke.active) return;
  const b = BRUSHES[tool];
  const raw = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const batch = (raw && raw.length) ? raw : [e];
  for (const ev of batch){
    const p = at(ev);
    // A little stabilization removes hand jitter without a long trailing stroke.
    if (tool === 'pencil' || tool === 'marker'){p.x=prev.x*.22+p.x*.78;p.y=prev.y*.22+p.y*.78;}
    p.pressure = prev.pressure*.65 + p.pressure*.35;
    if (Math.hypot(p.x-prev.x, p.y-prev.y) < .8 && b.kind !== 'wipe') continue;
    feedDynamics(p, prev, ev.timeStamp || performance.now());
    p.tilt = ev.tiltX || 0;
    if (b.kind === 'path'){
      stroke.pts.push(p);
      if (stroke.pts.length > 600){        // commit the tail so long strokes stay cheap
        stroke.size = brushSize(tool, effectivePressure(p));
        repaintPath(sctx);
        flattenScratch(b.flow, blendFor(tool));
        stroke.pts = stroke.pts.slice(-2);
      }
      prev = p;
      continue;
    }
    const size = brushSize(tool, effectivePressure(p));
    penTilt = p.tilt;
    if (b.kind === 'wipe') wipe(prev, p, size);
    else { segment(sctx, tool, color, prev, p, size, true); settleIfLingering(); }
    prev = p;
  }
  if (b.kind === 'path'){ stroke.size = brushSize(tool, effectivePressure(prev)); repaintPath(sctx); }
});

function finish(e){
  if (e && e.pointerId !== activeId) return;
  clearInterval(wetTimer); wetTimer = null;
  cancelAnimationFrame(liveFrame);live.style.display='none';art.style.visibility='visible';
  if (stroke.active){
    const b = BRUSHES[tool];
    if (b.kind !== 'wipe') flattenScratch(b.flow, blendFor(tool));
    scratch.style.opacity = 1;
    scratch.style.mixBlendMode = 'normal';
    stroke.active = false; stroke.pts = [];
    scheduleSave();
  }
  activeId = null; prev = null;wetColor=null;
}
hit.addEventListener('pointerup', finish);
hit.addEventListener('pointercancel', finish);
hit.addEventListener('lostpointercapture', finish);
window.addEventListener('blur', () => finish(null));

function wipe(p1,p2,size){
  const run = () => {
    actx.save();
    actx.globalCompositeOperation = 'destination-out';
    strokeSeg(actx, p1, p2, size || stroke.size, 'rgba(0,0,0,1)');
    actx.restore();
  };

}

window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('gesturestart', e => e.preventDefault());

/* ==================================================================
   6. Paint bucket, bounded by printed outlines (or artwork on plain paper)
=================================================================== */
function rgbOf(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }

function bucketFill(cx, cy, hex){
  const W = art.width, H = art.height;
  let x = Math.round(cx*dpr), y = Math.round(cy*dpr);
  if (x < 0 || y < 0 || x >= W || y >= H) return;

  const flat = document.createElement('canvas');
  flat.width = W; flat.height = H;
  const f = flat.getContext('2d', {willReadFrequently:true});
  f.drawImage(paper,0,0);
  const template=!!PICTURE_ART[paperId];
  if (!template) f.drawImage(art,0,0);
  const d = f.getImageData(0,0,W,H).data;

  if(template && guidePixels && guidePixels[y*W+x]>0)return;
  const i0 = (y*W+x)*4, tr = d[i0], tg = d[i0+1], tb = d[i0+2];
  const [fr,fg,fb] = rgbOf(hex);
  if (!template && (tr-fr)**2 + (tg-fg)**2 + (tb-fb)**2 < 400) return;
  history_.push();

  const TOL = 46*46*3;
  const seen = new Uint8Array(W*H), mask = new Uint8Array(W*H);
  const ok = i => {
    if (seen[i] || (template && guidePixels && guidePixels[i]>16)) return false;
    const o = i*4;
    return (d[o]-tr)**2 + (d[o+1]-tg)**2 + (d[o+2]-tb)**2 <= TOL;
  };

  const stack = [x,y];
  while (stack.length){
    const py = stack.pop(), sx = stack.pop();
    let px = sx, i = py*W+px;
    while (px > 0 && ok(i-1)){ px--; i--; }
    let up = false, down = false;
    while (px < W && ok(i)){
      seen[i] = 1; mask[i] = 1;
      if (py > 0){
        const u = i-W;
        if (!up && ok(u)){ stack.push(px,py-1); up = true; }
        else if (up && !ok(u)) up = false;
      }
      if (py < H-1){
        const w = i+W;
        if (!down && ok(w)){ stack.push(px,py+1); down = true; }
        else if (down && !ok(w)) down = false;
      }
      px++; i++;
    }
  }

  /* one-pixel grow so the fill tucks under the antialiased outline */
  const out = f.createImageData(W,H), od = out.data;
  for (let yy=0; yy<H; yy++){
    for (let xx=0; xx<W; xx++){
      const i = yy*W+xx;
      let on = mask[i];
      if (!on){
        if (xx>0 && mask[i-1]) on = 1;
        else if (xx<W-1 && mask[i+1]) on = 1;
        else if (yy>0 && mask[i-W]) on = 1;
        else if (yy<H-1 && mask[i+W]) on = 1;
      }
      if (!on) continue;
      if(template && !mask[i] && !guidePixels[i])continue;
      const o = i*4;
      od[o] = fr; od[o+1] = fg; od[o+2] = fb; od[o+3] = 255;
    }
  }
  const patch = document.createElement('canvas');
  patch.width = W; patch.height = H;
  patch.getContext('2d').putImageData(out,0,0);
  actx.save(); actx.setTransform(1,0,0,1,0,0); actx.drawImage(patch,0,0); actx.restore();
  scheduleSave();
}

/* ==================================================================
   7. History
=================================================================== */
const history_ = (() => {
  const undo = [], redo = [], MAX = 10;
  function snap(){ return {image:copyOf(art),paper:paperId,seed:pageSeed,words:traceText,width:vw,height:vh,designWidth,designHeight}; }
  function put(c){
    if(!c)return;
    designWidth=c.designWidth||c.width;designHeight=c.designHeight||c.height;
    setDocumentSize(c.width,c.height);sizeLayers();
    placeArtwork(c.image,c.width,c.height);
    resizeSource={image:c.image,width:c.width,height:c.height,revision:++artRevision};
    paperId=c.paper;pageSeed=c.seed;traceText=c.words||'HELLO';drawPaper();buildPaperSheet();
  }
  function trim(){
    while(undo.length+redo.length>2 && [...undo,...redo].reduce((n,s)=>n+s.image.width*s.image.height,0)>20000000){
      (undo.length>=redo.length?undo:redo).shift();
    }
  }
  const api = {
    push(){ artRevision++;undo.push(snap()); if (undo.length > MAX) undo.shift(); redo.length = 0; trim();api.ui(); },
    undo(){ if (!undo.length) return; redo.push(snap()); put(undo.pop());trim(); api.ui(); chime(420,'sine'); scheduleSave(); },
    redo(){ if (!redo.length) return; undo.push(snap()); put(redo.pop());trim(); api.ui(); chime(560,'sine'); scheduleSave(); },
    reset(){ undo.length = 0; redo.length = 0; trim();api.ui(); },
    ui(){
      document.getElementById('btnUndo').disabled = !undo.length;
      document.getElementById('btnRedo').disabled = !redo.length;
    }
  };
  return api;
})();

function freshPage(){
  finish();
  history_.push();
  actx.save(); actx.setTransform(1,0,0,1,0,0);
  actx.clearRect(0,0,art.width,art.height); actx.restore();
  clearScratch(); chime(240,'sine'); toast('Fresh page'); scheduleSave();

let audio = null, soundOn = true;
function chime(freq,type){
  if (!soundOn) return;
  try{
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.07, audio.currentTime + .012);
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + .17);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + .19);
  }catch(err){}
}

}

/* --- live sample stroke inside every tool button --- */
function drawSample(key){
  const cv = toolBtn[key].querySelector('canvas');
  const c = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,W,H);

  if (key === 'eraser'){
    c.fillStyle = '#c9cee0'; c.fillRect(0,H*.24,W,H*.52);
    c.globalCompositeOperation = 'destination-out';
    c.lineWidth = H*.55; c.lineCap = 'round';
    c.beginPath(); c.moveTo(W*.34,H/2); c.lineTo(W*.94,H/2); c.stroke();
    c.globalCompositeOperation = 'source-over';
    return;
  }
  if (key === 'fill'){
    c.fillStyle = color; c.strokeStyle = '#8b91b0'; c.lineWidth = 3;
    c.beginPath();
    if (c.roundRect) c.roundRect(12,5,W-24,H-10,10); else c.rect(12,5,W-24,H-10);
    c.fill(); c.stroke();
    return;
  }
  if (key === 'stamp'){
    c.font = (H*.86)+'px serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(stampChar, W/2, H/2+1);
    return;
  }

  /* run the real brush into a buffer, then composite at its flow */
  const buf = document.createElement('canvas');
  buf.width = W; buf.height = H;
  const bc = buf.getContext('2d');
  bc.lineCap = 'round'; bc.lineJoin = 'round';

  const savedPts = stroke.pts, savedCarry = stroke.carry, savedSize = stroke.size,
        savedDab = stroke.dabbedOnce, savedHue = stroke.hue, savedSeed = seed;
  seed = 7;
  stroke.carry = 0; stroke.dabbedOnce = false; stroke.hue = 0;

  const size = clamp(brushSize(key,.6)*.55, 5, H*.8);
  const pts = [];
  for (let i=0;i<=30;i++){
    const t = i/30;
    pts.push({x: 11 + t*(W-22), y: H/2 + Math.sin(t*Math.PI*2)*(H*.2), pressure:.6});
  }
  if (BRUSHES[key].kind === 'path'){
    stroke.pts = pts; stroke.size = size;
    const savedColor = color;
    repaintPath(bc);
    color = savedColor;
  } else {
    for (let i=1;i<pts.length;i++) segment(bc, key, color, pts[i-1], pts[i], size, false);
  }

  stroke.pts = savedPts; stroke.carry = savedCarry; stroke.size = savedSize;
  stroke.dabbedOnce = savedDab; stroke.hue = savedHue; seed = savedSeed;

  c.globalAlpha = BRUSHES[key].flow;
  c.drawImage(buf,0,0);
  c.globalAlpha = 1;
}

/* ==================================================================
   12. Full screen, wake lock, kid lock
   pushState throws on file:// pages, and iOS Safari has no Fullscreen
   API for non-video elements, so every call here is guarded and the
   grown-up sheet reports what actually took effect.
=================================================================== */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;

/* requestFullscreen exists in Chrome even when a permissions policy forbids
   it. fullscreenEnabled is the flag that actually tells the truth, so the
   old check reported "available" inside an embedded frame and then failed
   silently. */
const FS_METHOD  = !!(document.documentElement.requestFullscreen ||
                      document.documentElement.webkitRequestFullscreen);
const FS_ALLOWED = FS_METHOD && (document.fullscreenEnabled !== false) &&
                                (document.webkitFullscreenEnabled !== false);
const EMBEDDED   = (() => { try { return window.self !== window.top; } catch(err){ return true; } })();
const IOS        = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ANDROID    = /Android/.test(navigator.userAgent);
const FIREFOX    = /Firefox\//.test(navigator.userAgent);
const LINUX      = /Linux/.test(navigator.userAgent) && !ANDROID;
const STANDALONE = window.navigator.standalone === true ||
                   window.matchMedia('(display-mode: standalone)').matches ||
                   window.matchMedia('(display-mode: fullscreen)').matches;

/* What to tell a grown-up when the browser will not go full screen. */
function whyNotFullscreen(){
  if (STANDALONE) return '';
  if (EMBEDDED) return 'This preview may not allow full screen. Open the HTML file directly in your browser.';
  if (IOS) return 'Fullscreen support depends on your browser and device. Use Guided Access in Accessibility settings to restrict leaving the app.';
  if (ANDROID) return 'Try browser fullscreen if supported. Android App pinning can restrict leaving the browser.';
  if (!FS_ALLOWED) return 'This browser is refusing full screen for local files. Press F11 instead, or start the browser in kiosk mode.';
  if (FIREFOX) return 'Press F11 or start Firefox in kiosk mode to hide browser controls. System shortcuts can still leave the browser.';
  return 'The browser refused the full screen request. Press F11, or tap the banner to try again.';
}

function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return Promise.reject(new Error('unsupported'));
  try { return Promise.resolve(req.call(el, {navigationUI:'hide'})); }
  catch(err){ return Promise.reject(err); }
}
function leaveFullscreen(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (!ex || !fsEl()) return Promise.resolve();
  try { return Promise.resolve(ex.call(document)).catch(()=>{}); } catch(err){ return Promise.resolve(); }
}

let wakeLock = null;
async function keepAwake(on){
  try{
    if (on){
      if ('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(err){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='hidden'){finish();save();}
  if (locked && document.visibilityState === 'visible') keepAwake(true);
});

let navGuard = false;
function armNavGuard(){
  if(navGuard)return;
  try { history.pushState({kidlock:1},'',location.href); navGuard = true; }
  catch(err){ navGuard = false; }
}
window.addEventListener('popstate', () => {
  if (!locked) return;
  navGuard=false;armNavGuard(); toast('Hold the padlock for grown-ups');
});
window.addEventListener('beforeunload', e => {
  if (!locked) return;
  e.preventDefault(); e.returnValue = '';
});

let locked = false;

/* A resolved promise does not prove we are actually full screen: a window
   manager or a browser pref can refuse after the fact. Check the real
   state a moment later and report honestly either way. */
function verifyFullscreen(){
  setTimeout(() => {
    updateLockUI();
    if (locked && !fsEl() && !STANDALONE) toast('Tap the full screen button to try again', 3200);
  }, 600);
}

function setLocked(on){
  locked = on;
  if (on){
    enterFullscreen()
      .then(() => { updateLockUI(); verifyFullscreen(); })
      .catch(() => { updateLockUI(); verifyFullscreen(); });
    try {
      if (navigator.keyboard && navigator.keyboard.lock){
        const r = navigator.keyboard.lock(['Escape']);   // rejects in a frame
        if (r && r.catch) r.catch(()=>{});
      }
    } catch(err){}
    armNavGuard(); keepAwake(true);
  } else {
    leaveFullscreen();
    try {
      if (navigator.keyboard && navigator.keyboard.unlock){
        const r = navigator.keyboard.unlock();
        if (r && r.catch) r.catch(()=>{});
      }
    } catch(err){}
    keepAwake(false);
  }
  updateLockUI(); closeSheets();
  toast(on ? 'Child mode on · Hold 🔒 for grown-ups' : 'Child mode off', 2600);
}
function updateLockUI(){
  const b = document.getElementById('gLock');
  b.querySelector('.ico').textContent = locked ? '🔓' : '🔒';
  b.querySelector('.cap').textContent = locked ? 'Kid lock off' : 'Kid lock on';
  grown.classList.toggle('locked', locked);
  grown.querySelector('.badge').textContent = locked ? '🔓' : '🔒';
  const f = document.getElementById('gFull');
  f.querySelector('.ico').textContent = fsEl() ? '🗗' : '⛶';
  f.querySelector('.cap').textContent = fsEl() ? 'Leave full screen' : 'Full screen';
  document.getElementById('lockRing').classList.toggle('show', locked);
  const chip = document.getElementById('fsChip');
  const needs = locked && !fsEl() && !STANDALONE;
  document.getElementById('lockPill').classList.toggle('show', locked && !needs);
  chip.classList.toggle('show', needs);
  if (needs) chip.querySelector('span').textContent =
    FS_ALLOWED ? 'Tap for full screen' : 'Full screen blocked here, tap to see why';
  lockNote();
}
function lockNote(){
  const bits = [];
  bits.push(fsEl() ? 'Full screen is on.'
        : STANDALONE ? 'Running as an installed app, so it is already full screen.'
        : whyNotFullscreen());
  bits.push('A web page cannot prevent tab switching, system shortcuts, or leaving the browser. Use device-level parental controls for a stronger lock.');
  if (wakeLock) bits.push('The screen is being kept awake.');
  if (!storageOK) bits.push('This browser blocks storage for local files, so the drawing is not saved between sessions.');
  document.getElementById('lockNote').textContent = bits.join(' ');
}
/* ---- setup guide -------------------------------------------------
   A web page cannot block an edge swipe or a home gesture. Only the
   operating system can. These are the actual steps, per platform, and
   they are shown up front rather than buried in a note. ------------ */
function buildSetup(){
  const box=document.getElementById('setupSteps');
  box.innerHTML='<div class="step"><div class="n">1</div><div><h4>A little studio, all offline</h4><p>Choose a color and tap inside a picture with the bucket. Try crayons, rainbow paint and stamps. Paper has coloring adventures, tracing activities and endlessly generated surprise pages.</p></div></div>'+
  '<div class="step"><div class="n">2</div><div><h4>Make room for creativity</h4><p>Tap the padlock to start child mode and request full screen. Hold it for three seconds for grown-up controls. Undo also brings back cleared pages and previous templates. Drawings save on this device when browser storage is available; Save picture exports a PNG.</p></div></div>'+
  '<div class="step"><div class="n warn">!</div><div><h4>For a stronger lock</h4><p>A browser page cannot prevent tab switching, system shortcuts, or home gestures. '+
  (IOS?'Use iOS Guided Access from Accessibility settings to restrict leaving the app. Fullscreen support varies by device and browser.':ANDROID?'Use Android App pinning in device settings; availability and exit gestures vary by device.':'Browser kiosk mode hides tabs and browser controls, but system shortcuts can still leave it. Use your operating system’s parental controls or a restricted child session for stronger protection.')+
  '</p></div></div>';
  document.getElementById('setupDone').textContent='Let’s paint!';
}
document.getElementById('gSetup').addEventListener('click', () => { buildSetup(); openSheet('setupSheet'); });
document.getElementById('setupDone').addEventListener('click', () => {
  closeSheets();
  try { localStorage.setItem('artstudio-setup','1'); } catch(err){}
});

document.getElementById('gLock').addEventListener('click', () => setLocked(!locked));
document.getElementById('gFull').addEventListener('click', () => {
  if (fsEl()){ leaveFullscreen(); closeSheets(); return; }
  enterFullscreen().then(() => { updateLockUI(); closeSheets(); })
    .catch(() => { updateLockUI(); toast('Full screen was blocked, see the note below'); });
});
document.getElementById('fsChip').addEventListener('click', () => {
  enterFullscreen().then(updateLockUI).catch(() => { buildSetup(); openSheet('setupSheet'); });
});
document.addEventListener('fullscreenchange', updateLockUI);
document.addEventListener('webkitfullscreenchange', updateLockUI);

/* ==================================================================
   13. Odds and ends
=================================================================== */
let toastTimer = null;
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1400);
}
window.addEventListener('keydown', e => {
  if(e.target instanceof HTMLInputElement)return;
  if(activeId!==null || (locked && !sheetOpen())){e.preventDefault();return;}
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault(); e.shiftKey ? history_.redo() : history_.undo();
  }
  if (e.key === 'Escape') closeSheets();
  if (e.key === '[' || e.key === ']'){
    const i = TOOL_ORDER.indexOf(tool);
    setTool(TOOL_ORDER[(i + (e.key === ']' ? 1 : TOOL_ORDER.length-1)) % TOOL_ORDER.length]);
  }
});

let resizeTimer = null;
function relayout(delay){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { sizeLayers(); drawAllSamples(); }, delay || 120);
}
window.addEventListener('resize', () => relayout());
window.addEventListener('orientationchange', () => relayout(280));
if (vp){
  /* the toolbar sliding in or out changes the visible height without
     firing a window resize on some mobile browsers */
  vp.addEventListener('resize', () => relayout(80));
  vp.addEventListener('scroll', () => {
    document.documentElement.style.setProperty('--app-top', Math.round(vp.offsetTop)+'px');
    document.documentElement.style.setProperty('--app-h', viewH()+'px');
  });
}
document.addEventListener('fullscreenchange', () => relayout(60));

try { history.pushState({base:1},'',location.href); } catch(err){}

sizeLayers();
buildBottom();
setTool(tool);
document.getElementById('stDot').style.background = color;
updateLockUI();
history_.ui();
load();
setTimeout(drawAllSamples, 60);
try {
  if (!localStorage.getItem('artstudio-setup')){ buildSetup(); openSheet('setupSheet'); }
} catch(err){ buildSetup(); openSheet('setupSheet'); }
history_.ui();
new ResizeObserver(()=>sizeLayers()).observe(document.getElementById('stage'));
</script>
